services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: life_db
      POSTGRES_USER: life_user
      POSTGRES_PASSWORD: life_password
    volumes:
      - life_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U life_user -d life_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    env_file:
      - .env
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/app

volumes:
  life_pgdata:
