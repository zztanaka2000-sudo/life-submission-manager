<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ログイン | LIFE提出管理</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-5 col-lg-4">
      <div class="card shadow-sm">
        <div class="card-body p-4">
          <h1 class="h4 mb-4">LIFE提出管理</h1>
          {% if form.errors %}<div class="alert alert-danger">ユーザー名またはパスワードを確認してください。</div>{% endif %}
          <form method="post">
            {% csrf_token %}
            <div class="mb-3">
              <label class="form-label" for="id_username">ユーザー名</label>
              <input class="form-control" type="text" name="username" autofocus required id="id_username">
            </div>
            <div class="mb-3">
              <label class="form-label" for="id_password">パスワード</label>
              <input class="form-control" type="password" name="password" required id="id_password">
            </div>
            <button class="btn btn-primary w-100">ログイン</button>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
